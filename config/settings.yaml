# Deal Radar settings. Non-secret. Secrets (ANTHROPIC_API_KEY, NTFY_TOPIC) live in
# GitHub Actions secrets / local .env only.

timezone: America/Los_Angeles
app_url: https://amethystpeptideslabs.github.io/energy-protein-radar/

# Web search localization (approximate). City as you gave it.
location:
  type: approximate
  city: Orange County
  region: California
  country: US
  timezone: America/Los_Angeles

# ---------------------------------------------------------------- models & cost
models:
  # Cheapest-that-works defaults. Calibrate uses Sonnet once for label/ref accuracy.
  research:
    quick: claude-haiku-5-5
    deep: claude-haiku-5-5
    calibrate: claude-sonnet-5-5
    check: claude-haiku-5-5
  extract: claude-haiku-5-5
  web_search_tool: web_search_20260209       # dynamic filtering
  web_search_fallback: web_search_20250305   # used with allowed_callers: [direct] if needed
  max_research_tokens: 8000
  max_extract_tokens: 16000
  max_pause_continuations: 6

# USD per million tokens + per-search fee. Checked against
# platform.claude.com/docs/en/about-claude/pricing on 2026-11-16.
prices:
  web_search_per_1k: 10.00
  claude-sonnet-5-5: {input: 2.00, cache_write_5m: 2.50, cache_read: 0.10, output: 10.00}
  claude-haiku-5-5:
    input: 0.10
    cache_write_5m: 0.125
    cache_read: 0.01
    output: 0.50
    long_prompt_threshold: 100000
    long: {input: 0.50, cache_write_5m: 0.625, cache_read: 0.05, output: 2.50}
  claude-opus-5-5: {input: 4.00, cache_write_5m: 5.00, cache_read: 0.20, output: 20.00}

budget:
  monthly_usd_default: 40      # overridden by MONTHLY_BUDGET_USD env if set
  downgrade_at_pct: 80         # deep -> quick above this share of the cap
  max_run_usd: 8.00            # hard stop for a single run (safety; calibrate is the priciest)

# ---------------------------------------------------------------- run modes
schedule:
  # github.event.schedule cron string -> slot (must match daily_scan.yml)
  crons:
    "17 7 * * *": morning
    "17 12 * * 4,5": midday
    "17 18 * * *": evening
  deep_weekdays: [0, 3]        # Mon=0 ... Thu=3
  deal_season:
    - {start: 2026-11-20, end: 2026-12-02, label: "Black Friday / Cyber Monday"}

research:
  # engine: claude-session = a scheduled Claude session on your existing plan does the web
  # research (docs/RESEARCH_PROTOCOL.md) and runs `deal_hunter.py --ingest`; no API credits.
  # engine: api = GitHub Actions + ANTHROPIC_API_KEY (paid, optional; workflow is manual-only).
  engine: claude-session
  case_min_units: 12           # a pack of 12+ units counts as a case (cases are the priority)
  session_budgets:             # web searches per job for the Claude-session engine
    quick: 6                   # x3 categories
    midday: 5                  # x3 categories (Thu/Fri weekend-promo check)
    deep: 12                   # x3 categories (Mon/Thu)
    calibrate: 2               # x25 products (first run only)
    deep_single: 3             # --only <product>
  quick_max_uses: 8
  midday_max_uses: 6
  deep_max_uses: 4
  calibrate_max_uses: 5
  offer_carryover_days: 2      # offers seen in the last N days stay "current" unless expired
  offers_per_product_in_app: 6

# ---------------------------------------------------------------- tiers
tiers:
  energy:
    # thresholds on cents-rounded $/can (CRV included). STEAL < steal; HOT <= hot; SOLID <= solid; SKIP above
    by_size:
      "16": {steal: 1.25, hot: 1.55, solid: 1.85}
      "12": {steal: 0.94, hot: 1.16, solid: 1.39}
    base_size_oz: 16           # other sizes scale linearly from the 16oz row
  protein:
    # % of ref_unit_price: STEAL <= 70, HOT <= 80, SOLID <= 90, SKIP above
    steal_pct: 70
    hot_pct: 80
    solid_pct: 90
  protein_value:               # $ per 10g protein badge
    - {max: 0.90, badge: "💪"}
    - {max: 1.20, badge: "👍"}
    - {max: 1.60, badge: "😐"}
    - {max: 999, badge: "💸"}

crv:
  per_container_usd: 0.05
  under_oz: 24

validation:
  stale_days: 21
  unverified_energy_below: 0.75
  unverified_protein_below_pct: 50
  size_tolerance_oz: 0.6
  dead_code_skip_days: 60
  second_source_tolerance_pct: 5

notify:
  server: https://ntfy.sh/
  max_pushes_per_run: 3
  steal_dedupe_hours: 72

history:
  raw_offer_retention_days: 90

# ---------------------------------------------------------------- retailers
