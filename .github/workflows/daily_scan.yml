name: Daily deal scan

on:
  schedule:
    - cron: '17 7 * * *'      # daily morning run (auto mode picks quick/deep/calibrate)
      timezone: 'America/Los_Angeles'
    - cron: '17 12 * * 4,5'   # Thu+Fri midday weekend-promo check
      timezone: 'America/Los_Angeles'
    - cron: '17 18 * * *'     # evening run, no-op (zero API calls) outside deal_season
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        options: [auto, quick, deep, calibrate, check]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deal-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      TZ: America/Los_Angeles
    outputs:
      status: ${{ steps.scan.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests must pass before the scan runs
        run: pytest -q
      - name: Scan
        id: scan
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MONTHLY_BUDGET_USD: ${{ secrets.MONTHLY_BUDGET_USD }}
          DEAL_RADAR_SCHEDULE: ${{ github.event.schedule }}
          RUN_MODE: ${{ inputs.mode || 'auto' }}
        run: python deal_hunter.py --mode "$RUN_MODE"
      - name: Commit results (every run writes status.json heartbeat)
        if: always() && steps.scan.outputs.commit != 'false'
        env:
          MODE: ${{ steps.scan.outputs.mode }}
          STATUS: ${{ steps.scan.outputs.status }}
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data Obsidian-Vault
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "radar: $(date +%F) ${MODE:-unknown} ${STATUS:-unknown}"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Fail the job if the scan failed (after committing status)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Scan failed. See data/status.json for the reason."
          exit 1

  pages:
    needs: scan
    if: always()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
