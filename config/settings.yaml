# Deal Radar settings. Non-secret. Secrets (ANTHROPIC_API_KEY, NTFY_TOPIC) live in
# GitHub Actions secrets / local .env only.

timezone: America/Los_Angeles
app_url: https://amethystpeptideslabs.github.io/energy-protein-radar/

# Local-first: in-store and buy-online-pick-up-in-store at stores near you rank above
# ship-to-home offers in the same tier. Online deals still show.
home_area: "Orange County, CA (Anaheim Hills / North OC first)"
prefer_local_pickup: true
# Store-specific deals (local_store) and stock notes must name one of these; anything else is
# dropped / cleared. Online and ship-to-home prices are unaffected.
home_area_cities: [Orange County, Aliso Viejo, Anaheim, Anaheim Hills, Brea, Buena Park, Costa Mesa, Cypress, Dana Point,
  Foothill Ranch, Fountain Valley, Fullerton, Garden Grove, Huntington Beach, Huntington Bch, Irvine,
  La Habra, La Palma, Ladera Ranch, Laguna Beach, Laguna Hills, Laguna Niguel, Laguna Woods, Lake Forest,
  Los Alamitos, Mission Viejo, Newport Beach, Orange, Placentia, Rancho Santa Margarita, San Clemente,
  San Juan Capistrano, Santa Ana, Seal Beach, Stanton, Tustin, Villa Park, Westminster, Yorba Linda]

# Web search localization (approximate). City as you gave it.
location:
  type: approximate
  city: Anaheim
  region: California
  country: US
  timezone: America/Los_Angeles

# ---------------------------------------------------------------- models & cost
models:
  # Cheapest-that-works defaults. Calibrate uses Sonnet once for label/ref accuracy.
  research:
    quick: claude-haiku-5-5
    deep: claude-haiku-5-5
    calibrate: claude-sonnet-5-5
    check: claude-haiku-5-5
  extract: claude-haiku-5-5
  web_search_tool: web_search_20260209       # dynamic filtering
  web_search_fallback: web_search_20250305   # used with allowed_callers: [direct] if needed
  max_research_tokens: 8000
  max_extract_tokens: 16000
  max_pause_continuations: 6

# USD per million tokens + per-search fee. Checked against
# platform.claude.com/docs/en/about-claude/pricing on 2026-11-16.
prices:
  web_search_per_1k: 10.00
  claude-sonnet-5-5: {input: 2.00, cache_write_5m: 2.50, cache_read: 0.10, output: 10.00}
  claude-haiku-5-5:
    input: 0.10
    cache_write_5m: 0.125
    cache_read: 0.01
    output: 0.50
    long_prompt_threshold: 100000
    long: {input: 0.50, cache_write_5m: 0.625, cache_read: 0.05, output: 2.50}
  claude-opus-5-5: {input: 4.00, cache_write_5m: 5.00, cache_read: 0.20, output: 20.00}

budget:
  monthly_usd_default: 40      # overridden by MONTHLY_BUDGET_USD env if set
  downgrade_at_pct: 80         # deep -> quick above this share of the cap
  max_run_usd: 8.00            # hard stop for a single run (safety; calibrate is the priciest)

# ---------------------------------------------------------------- run modes
schedule:
  # github.event.schedule cron string -> slot (must match daily_scan.yml)
  crons:
    "17 7 * * *": morning
    "17 12 * * 4,5": midday
    "17 18 * * *": evening
  deep_weekdays: [0, 3]        # Mon=0 ... Thu=3
  deal_season:
    - {start: 2026-11-20, end: 2026-12-02, label: "Black Friday / Cyber Monday"}

research:
  # engine: claude-session = a scheduled Claude session on your existing plan does the web
  # research (docs/RESEARCH_PROTOCOL.md) and runs `deal_hunter.py --ingest`; no API credits.
  # engine: api = GitHub Actions + ANTHROPIC_API_KEY (paid, optional; workflow is manual-only).
  engine: claude-session
  case_min_units: 12           # a pack of 12+ units counts as a case (cases are the priority)
  session_budgets:             # web searches per job for the Claude-session engine
    quick: 6                   # rtd
    quick_energy: 8            # energy (27 brands, rotating focus)
    quick_snack: 7             # snacks (15 products, rotating focus)
    midday: 5                  # snack, rtd (daily midday sale check)
    midday_energy: 6
    deep: 12                   # rtd (Mon/Thu)
    deep_energy: 10            # per energy job (deep runs split energy into deep_jobs.energy jobs)
    deep_snack: 8              # per snack job
    calibrate: 2               # per product (first full calibrate only)
    calibrate_new: 2           # per newly added product, once
    deep_single: 3             # --only <product>
    quick_amazon: 6            # Amazon sweep: rotating third of the energy drinks + deal pages
    midday_amazon: 3           # Amazon Today's Deals / Lightning deals + fresh Slickdeals posts
    deep_amazon: 12            # every tracked energy drink on Amazon
  focus_groups: {energy: 3, snack: 2}   # quick runs research 1/N of the category in depth (rotates daily)
  deep_jobs: {energy: 2, snack: 2}      # deep runs split the category into N jobs
  calibrate_new_per_run: 6     # newly added products calibrated per run until all are done
  quick_max_uses: 8
  midday_max_uses: 6
  deep_max_uses: 4
  calibrate_max_uses: 5
  offer_carryover_days: 2      # regular prices seen in the last N days stay "current" unless expired
  sale_fresh_hours: 20         # sales and deals must be re-confirmed by a scan within N hours or they drop off
  verify_max: 20               # live sales/deals re-checked per scan (1 search each, deals then promos first)
  offers_per_product_in_app: 6

# ---------------------------------------------------------------- tiers
tiers:
  energy:
    # thresholds on cents-rounded $/can (CRV included). STEAL < steal; HOT <= hot; SOLID <= solid; SKIP above
    by_size:
      "16": {steal: 1.25, hot: 1.55, solid: 1.85}
      "12": {steal: 0.94, hot: 1.16, solid: 1.39}
    base_size_oz: 16           # other sizes scale linearly from the 16oz row
  protein:
    # % of ref_unit_price: STEAL <= 70, HOT <= 80, SOLID <= 90, SKIP above
    steal_pct: 70
    hot_pct: 80
    solid_pct: 90
  protein_value:               # $ per 10g protein badge
    - {max: 0.90, badge: "💪"}
    - {max: 1.20, badge: "👍"}
    - {max: 1.60, badge: "😐"}
    - {max: 999, badge: "💸"}

crv:
  per_container_usd: 0.05
  under_oz: 24

validation:
  stale_days: 21
  sale_evidence_max_days: 7   # sale/deal-post evidence older than this is rejected (unless an end date is still ahead)
  unverified_energy_below: 0.75
  unverified_protein_below_pct: 50
  size_tolerance_oz: 0.6
  dead_code_skip_days: 60
  second_source_tolerance_pct: 5
  # Third-party price trackers never count as a source (owner rule: they sit behind a paywall and
  # aren't the store). Costco offers must come from costco.com itself (official_source_only).
  blocked_source_domains: [warehouserunner.com, costco97.com]

notify:
  server: https://ntfy.sh/
  max_pushes_per_run: 3
  steal_dedupe_hours: 72

history:
  raw_offer_retention_days: 90

# ---------------------------------------------------------------- retailers
# physical: has stores you can walk into (app shows Nearest store + Check stock)
# pickup: buy online, pick up in store / curbside is normally offered
# stock_search: retailer search page where you can set your store and see availability
retailers:
  vitamin-shoppe:
    physical: true
    pickup: true
    stock_search: "https://www.vitaminshoppe.com/search?search={q}"
    name: The Vitamin Shoppe
    domains: [vitaminshoppe.com]
    type: supplement
    playbook: "BOGO 50% (Buy One, Get One 50% Off) runs constantly on energy-drink cases and protein bars, online + in store; add 2 to cart. In-store $1/can energy weekends (usually start Thu, sometimes Fri; limit ~6). Auto-Delivery 10-15% off online (not with BOGO). Set My Store to Orange so product pages show its pickup stock; check Brea second."
    home_store: Orange          # best-stocked for drinks and snacks; owner is in Anaheim Hills
    check_stores: [Orange, Brea]  # every store check reads pick-up stock at both, Orange first
    local_stores:   # Orange County stores in Vitamin Shoppe's own store locator (checked 2026-11-16)
      - {name: Orange, address: "1300 N Tustin St, Orange, CA 92867", locator_zip: "92867"}
      - {name: Brea, address: "299 S Randolph St, Brea, CA 92821", locator_zip: "92821"}
      - {name: Aliso Viejo, id: 133, address: "26831 Aliso Creek Rd, Aliso Viejo, CA 92656", phone: "(949) 349-0690"}
      - {name: Costa Mesa, address: "3929 S Bristol St, Bldg C, Santa Ana, CA 92704"}
      - {name: Huntington Beach, address: "7672 Edinger Ave, Huntington Beach, CA 92647"}
  gnc: {physical: true, pickup: true, stock_search: "https://www.gnc.com/search?q={q}", name: GNC, domains: [gnc.com], type: supplement,
    playbook: "BOGO 50% on RTD/bars is common. Pro Access member pricing is membership-gated (🔒). In-store $1 energy promos mirror Vitamin Shoppe some weekends."}
  campus-protein: {physical: false, name: Campus Protein, domains: [campusprotein.com], type: supplement, playbook: "Site-wide % codes; free shipping thresholds."}
  suppz: {physical: false, name: Suppz, domains: [suppz.com], type: supplement, playbook: "Frequent sitewide codes; check shipping minimum."}
  muscle-strength: {physical: false, name: Muscle & Strength, domains: [muscleandstrength.com], type: supplement, playbook: "Store codes stack with some brand promos; free shipping over threshold."}
  xn-supps: {physical: false, name: XN Supps, domains: [xnsupps.com], type: supplement, playbook: "Case pricing on energy drinks; codes common."}
  bodybuilding-com: {physical: false, name: Bodybuilding.com Shop, domains: [shop.bodybuilding.com, bodybuilding.com], type: supplement, playbook: "Sitewide codes; verify current storefront."}
  iherb: {physical: false, name: iHerb, domains: [iherb.com], type: supplement, playbook: "New-customer and sitewide codes; free shipping thresholds."}
  vitacost: {physical: false, name: Vitacost, domains: [vitacost.com], type: supplement, playbook: "Sitewide % codes; Autoship 5%."}
  amazon: {physical: false, stock_search: "https://www.amazon.com/s?k={q}", name: Amazon, domains: [amazon.com], type: big-box,
    playbook: "Clip coupon + Subscribe & Save (5%, or 15% with 5+ subscriptions in one delivery). Prime free shipping. Only Sold by Amazon.com or the brand's own store counts."}
  walmart: {physical: true, pickup: true, stock_search: "https://www.walmart.com/search?q={q}", name: Walmart, domains: [walmart.com], type: big-box, playbook: "Rollbacks; free shipping $35+ or Walmart+ (🔒)."}
  target: {physical: true, pickup: true, stock_search: "https://www.target.com/s?searchTerm={q}", name: Target, domains: [target.com], type: big-box, playbook: "Target Circle offers (free to join) stack with sales; Circle Card 5% off."}
  costco: {physical: true, pickup: false, official_source_only: true, name: Costco, domains: [costco.com], type: club, membership: true, playbook: "Membership required (🔒). Monthly instant savings coupons; online prices higher than warehouse."}
  sams-club: {physical: true, pickup: true, stock_search: "https://www.samsclub.com/s/{q}", name: Sam's Club, domains: [samsclub.com], type: club, membership: true, playbook: "Membership required (🔒). Instant savings; Plus members get free shipping."}
  ralphs: {physical: true, pickup: true, stock_search: "https://www.ralphs.com/search?query={q}", name: Ralphs, domains: [ralphs.com, kroger.com], type: grocery, playbook: "Kroger digital coupons + Mega Events (buy 5 save $5). Carries Drumroll."}
