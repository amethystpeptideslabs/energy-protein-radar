# Tracked products. Edit and push to add/remove. Seed values come from a Nov 2026 web
# snapshot; the calibrate run verifies protein-per-unit from labels and replaces
# ref_unit_price with the median REGULAR (non-promo) price across major retailers.
# Calibrated values are stored in data/memory.json and override the seeds below.
#
# Fields:
#   category: energy | snack | rtd
#   unit_size_oz: fluid oz for drinks (strict size match), net wt oz for snacks (informational)
#   size_range_oz: optional [min, max] accepted sizes (drinks only)
#   ref_unit_price: seed regular price per unit (null = unknown until calibrated)
#   crv_applies: add CA CRV ($0.05 per container under 24 oz)
#   needs_verification: seed values conflict between sources; calibrate must confirm

defaults:
  energy:
    unit_label: can
    crv_applies: true
    protein_g: 0
    plant_based: false
    enabled: true
    retailers_priority: [vitamin-shoppe, gnc, target, walmart, costco, sams-club, grocery-outlet, ralphs, vons, sprouts, amazon]
    exclude_terms: [powder, tub, stick, sticks, packet, packets, "energy shot", "energy shots", hydration, pre-workout]
    # Gym / performance energy only: these mainstream brands are never tracked or reported.
    exclude_brands: [monster, red bull, rockstar, nos energy, full throttle, 5-hour, 5 hour energy, prime energy,
                     v8 energy, starbucks, venom energy, mountain dew]
  snack:
    unit_label: bar
    crv_applies: false
    plant_based: false
    enabled: true
    retailers_priority: [target, walmart, costco, vitamin-shoppe, gnc, grocery-outlet, ralphs, vons, sprouts, amazon]
    exclude_terms: [powder, tub, gummies, gummy, vegan, plant-based, plant based]
  rtd:
    unit_label: bottle
    crv_applies: false
    plant_based: false
    enabled: true
    retailers_priority: [costco, sams-club, target, walmart, vitamin-shoppe, gnc, grocery-outlet, ralphs, vons, amazon]
    exclude_terms: [powder, tub, vegan, plant-based, plant based, "protein water"]

